services:
  pulser-ui:
    image: ghcr.io/agoraiot/pulser-ui@sha256:1ca3c3821b4f6709b8589ed547aa39c9fb8e07e43c8e19b2c9c0d4f5f18dc2f1
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - slbapps
  pulser:
    image: ghcr.io/agoraiot/pulser-pulser@sha256:1c9e5d2e4d4bd704473339b385c01e84aefa930c3341084a459b0904cbed5e85
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sleep 2"]
      interval: 1s
      retries: 1
    networks:
      - slbapps
  caddy:
    build:
      context: 'caddy/'
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9443:80"
    networks:
      - slbapps
  alpine-redis:
    image: redis:8.2.3-alpine3.22
    restart: unless-stopped
    networks:
     - slbapps
  eclipse-mosquitto:
    build:
        context: 'mosquitto/'
        dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - slbapps
  nats:
    image: nats:2.12.1-alpine3.22
    ports:
      - 4222:4222
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sleep 2"]
      interval: 1s
      retries: 1
    networks:
      - slbapps  
  computation-example:
    environment:
      - MQTT_HOST=nats
      - MQTT_PORT=4222
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5679:5678"
    depends_on:
      nats:
        condition: service_healthy
      pulser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sleep 2"]
      interval: 1s
      retries: 1
    networks:
      slbapps:

  simu-launcher:
    build:
      context: .
      dockerfile: Dockerfile.simu-launcher
    depends_on:
      pulser:
        condition: service_healthy
      computation-example:
        condition: service_healthy
    networks:
      - slbapps

networks:
  slbapps:
    driver: bridge
